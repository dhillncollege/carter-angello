<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Carter Angello | Contact Us</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../style.css">
        <link rel="icon" href="../images/logo.ico">
    </head>
    <body>

        <ul class="topnav">
			<li class="logo-container">
				<img src="../images/logo.png" class="logo" height="6%" width="6%">
				<p>Carter Angello</p>
			</li>
			<ul class="topnav-links">
				<li><a href="../index.html">Home</a></li>
				<li><a href="./about.html">About Us</a></li>

        <div class="content">
            <h2 class="title">Contact Us</h2>
            <form action="../contact.php" method="POST">
                <div class="contact">
                    <div class="form-field">
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name" class="text-entry" required><br><br>
                    </div>

                    <div class="form-field">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" class="text-entry" required><br><br>
                    </div>

                    <div class="form-field">
                        <label for="message">Your Message:</label>
                        <textarea type="text" id="message" name="message" class="text-entry" rows="4" oninput="autoResize(this)"></textarea>
                    </div>
                    <input type="submit" value="Submit" id="submit">
                </div>
            </form>

            <div class="socials-container">
                <div class="icons">
                    <img src="../images/instagram.svg" alt="Instagram" onclick="instagram()">
                    <img src="../images/facebook.svg" alt="Facebook" onclick="facebook()">
                    <img src="../images/youtube.svg" alt="YouTube" onclick="youtube()">
                </div>
            </div>
        </div>

        <footer>
            <div class="footer-text">
                Copyright &#169; 2025 Carter Angello. All Rights Reserved.
            </div>
            
        </footer>

        <script src="../script.js"></script>
